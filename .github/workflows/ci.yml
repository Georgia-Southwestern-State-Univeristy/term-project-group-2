name: GDScript Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run GDScript Unit Tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "3.2.2" # Godot 3.2.2 for your project

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Godot Engine
      run: |
        wget https://downloads.godotengine.org/?version=3.2.2&flavor=stable&slug=x11.64.zip&platform=linux.64 -O godot.zip
        unzip godot.zip -d godot-engine
        chmod +x godot-engine/Godot_v3.2.2-stable_x11.64
      shell: bash

    - name: Run GDScript Unit Tests (headless)
      run: |
        ./godot-engine/Godot_v3.2.2-stable_x11.64 --path . --headless --script addons/gut/gut_cmdln.gd -- -gdir=res://test
      # Adjust the script/arguments above to match how your repo runs tests
