name: GDScript Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download Godot 4.2.2
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
        unzip godot.zip -d godot-engine
        chmod +x godot-engine/Godot_v4.2.2-stable_linux.x86_64

    - name: Import project
      run: |
        ./godot-engine/Godot_v4.2.2-stable_linux.x86_64 \
        --headless \
        --path . \
        --quit

    - name: Run GUT tests
      run: |
        ./godot-engine/Godot_v4.2.2-stable_linux.x86_64 \
        --headless \
        --path . \
        --script res://addons/gut/gut_cmdln.gd \
        -- -gdir=res://tests -gexit
