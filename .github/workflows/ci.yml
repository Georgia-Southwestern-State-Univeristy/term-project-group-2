name: GDScript Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run GDScript Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Godot 3.2.2 Headless from GitHub Releases
      run: |
        wget https://github.com/godotengine/godot/releases/download/3.2.2-stable/Godot_v3.2.2-stable_linux_headless.64.zip -O godot.zip
        unzip godot.zip -d godot-engine
        chmod +x godot-engine/Godot_v3.2.2-stable_linux_headless.64

    - name: Run GDScript Unit Tests (headless)
      run: |
        ./godot-engine/Godot_v3.2.2-stable_linux_headless.64 --path . --headless --script addons/gut/gut_cmdln.gd -- -gdir=res://test
