name: GUT Tests + Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run GUT Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64
          mv Godot_v4.6.1-stable_linux.x86_64 godot

      - name: Import project
        run: |
          ./godot --headless --path SpaceHunter_game --import || true

      - name: Run GUT tests
        run: |
          ./godot --headless --path SpaceHunter_game -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gprefix=test_ \
            -gsuffix=.gd \
            -gexit_on_success \
            -glog=1

  build-windows:
    runs-on: ubuntu-latest
    name: Build Windows EXE
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Godot headless 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux_headless.x86_64
          chmod +x Godot_v4.6.1-stable_linux_headless.x86_64
          mv Godot_v4.6.1-stable_linux_headless.x86_64 godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          unzip -q Godot_v4.6.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.1.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.1.stable/

      - name: Import project
        run: |
          ./godot --headless --path SpaceHunter_game --import || true

      - name: Build Windows EXE
        run: |
          mkdir -p build
          ./godot --headless --verbose --path SpaceHunter_game \
            --export-release "Windows Desktop" build/SpaceHunter.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/SpaceHunter.exe
