name: GUT Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run GUT Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64
          mv Godot_v4.6.1-stable_linux.x86_64 godot

      - name: Import project
        run: |
          ./godot --headless --path . --import || true

      - name: Run GUT tests
        run: |
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gprefix=test_ \
            -gsuffix=.gd \
            -gexit_on_success \
            -glog=1
